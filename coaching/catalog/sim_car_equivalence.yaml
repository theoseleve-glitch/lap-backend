# Sim↔real car equivalence table (ADR-014, T139).
#
# Maps sim-specific car identifiers (iRacing car_id, ACC car slug,
# AC mod folder name…) to the canonical `master_car_id` defined by
# the YAMLs in `coaching/catalog/cars/`. Same physical car,
# multiple sim representations, one master id.
#
# Provider conventions:
#   iracing - iRacing internal car_id (integer, stringified)
#   acc     - ACC car-name slug (e.g. "porsche_991ii_gt3_r")
#   ac      - Assetto Corsa folder name under `content/cars/`
#   real    - real-world capture (rare; usually inferred)
#
# Seed values are illustrative — sim_car_ids will be refined as
# canonical sources (iRacing data export, ACC SDK) become available.

pairs:
  # Porsche 911 GT3 R — three sim representations of one real car.
  - provider: iracing
    sim_car_id: "64"
    master_car_id: 019dcacb-7000-7000-8000-100000000001
  - provider: acc
    sim_car_id: porsche_991ii_gt3_r
    master_car_id: 019dcacb-7000-7000-8000-100000000001
  - provider: ac
    sim_car_id: ks_porsche_911_gt3_r_2019
    master_car_id: 019dcacb-7000-7000-8000-100000000001

