id: "rc.pit_exit_safety.slow_merge"
version: 1
category: technique
subcategory: pit_exit_safety
difficulty: beginner

detection:
  signal: pit_exit_avg_merge_speed_deficit_kmh
  condition: "pit_exit_avg_merge_speed_deficit_kmh >= 5.0 and pit_exit_event_count >= 2"
  context:
    must_have_channels: ["throttle", "speed", "lap_position", "pit_lane_state"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 5.0 = low, 8.0 = medium, 12.0 = high"

explanation_template:
  beginner: "Across {{pit_exit_event_count}} pit exits you merged back at {{pit_exit_avg_merge_speed_deficit_kmh}} km/h slower than your own clean-air pace. That's a safety issue (cars behind have to lift hard) and a courtesy issue (you bleed their lap time). Be on full throttle by the blend line, not after — pre-decide the apex of the pit-out turn before you leave the pit box, so you're committing on instinct, not reading the line."
  intermediate: "Pit-exit merge deficit avg {{pit_exit_avg_merge_speed_deficit_kmh}} km/h, n={{pit_exit_event_count}}. The coachable failure mode is geometry hesitation at the blend — drivers tend to look at the wall on exit instead of the racing line. Drill: identify the pit-exit racing line as a corner with its own apex / track-out reference, the same way you treat T1. Same self-as-baseline frame as T138 (restart launch) — your own clean-air pace is the reference, not cohort percentile."
  advanced: "Pit-exit merge deficit {{pit_exit_avg_merge_speed_deficit_kmh}} km/h, n={{pit_exit_event_count}}. Dual-cost framing: (a) safety — compressed train into the next braking zone elevates contact probability for cars behind, accruing steward attention even when you're not the one who crashes; (b) competitive — slow merge gives back undercut/overcut value the strategy team paid for. The drill mirrors T138 (event-rehearsal as a closed-loop motor program): pit exit has its own gear / RPM / line setpoints, pre-decided per circuit. Discipline follows from preparation."

prescription:
  drill_template_id: "drill.pit_exit_blend_line_anchor"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "pit_exit_avg_merge_speed_deficit_kmh"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["pit-exit blend transfers — racing-line discipline at the merge is the same skill on either platform. Real-car pit exits often have additional constraints (pit-lane speed limit transitions, mandatory ECU settings, fuel-flow ramp-up timing) that can inflate the deficit by 1-2 km/h independently of skill; the threshold may need a small relaxation (e.g., 6.0 km/h) for real-car cohorts in series with strict fuel-flow regulations."]
