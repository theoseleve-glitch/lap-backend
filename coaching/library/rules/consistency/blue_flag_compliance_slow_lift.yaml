id: "rc.blue_flag_compliance.slow_lift"
version: 1
category: technique
subcategory: blue_flag_compliance
difficulty: beginner

detection:
  signal: blue_flag_avg_lift_response_seconds
  condition: "blue_flag_avg_lift_response_seconds >= 3.0 and blue_flag_event_count >= 3"
  context:
    must_have_channels: ["throttle", "lap_position", "flag_state"]
    min_corner_priority: low
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 3.0 = low, 5.0 = medium, 8.0 = high"

explanation_template:
  beginner: "When you saw a blue flag, your average response was {{blue_flag_avg_lift_response_seconds}}s before lifting (across {{blue_flag_event_count}} events). That's slow — faster cars expect a clean cut-and-let-by within 1-2 seconds, and a slow lift puts both of you at risk on the next braking zone. When you see blue, look for the next safe lift point and take it; you give back nothing of your race by yielding once."
  intermediate: "Blue-flag avg lift response {{blue_flag_avg_lift_response_seconds}}s over {{blue_flag_event_count}} events. The cost-benefit is asymmetric: defending a position against a faster car you can't hold typically loses 2-4s when contact happens, while a clean prompt yield costs <1s and resets the gap. Use the previous-corner exit visibility to identify the upcoming safe lift point so you don't have to think about it under flag — pre-decide the lift location lap-by-lap."
  advanced: "Blue-flag avg response {{blue_flag_avg_lift_response_seconds}}s, n={{blue_flag_event_count}}. The competitive frame: yielding to faster cars is a positive-expected-value move (you preserve race finishing position by not racing for free), and slow compliance accumulates incident-report risk in series with stewards. Operationally, build a per-track 'safe lift map' — for each blue-likely zone, know which exit lifts cleanly without compromising your own lap time on the next sector. The drill is map-building, not yielding-discipline; the discipline follows from the map."

prescription:
  drill_template_id: "drill.safe_lift_map_per_track"
  expected_gain_kmh: "0-1"
  success_condition:
    metric: "blue_flag_avg_lift_response_seconds"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["blue-flag compliance transfers — the etiquette is the same skill on either platform. Sim drivers may receive blue flags more aggressively (algorithmic stewarding doesn't read context), while real-stewards judge case-by-case; the threshold may need a small relaxation (e.g., 4.0s) for sim cohorts where one missed lift accrues a faster-than-fair penalty signal. The map-building drill transfers identically."]
