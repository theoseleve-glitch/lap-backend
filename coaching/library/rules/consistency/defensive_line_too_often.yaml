id: "rc.defensive_line.too_often"
version: 1
category: technique
subcategory: defensive_line
difficulty: intermediate

detection:
  signal: defensive_line_lap_share
  condition: "defensive_line_lap_share >= 0.40 and lap_time_loss_per_defensive_lap_seconds >= 0.30"
  context:
    must_have_channels: ["lap_time", "lap_position"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.30 = low, 0.45 = medium, 0.70 = high"

explanation_template:
  beginner: "You ran a defensive line on {{defensive_line_lap_share}} of laps and each one cost you {{lap_time_loss_per_defensive_lap_seconds}}s. Defending non-stop adds up fast — even a 0.4s tax on every other lap is more time lost than a typical pass attempt would risk. Defend when there's a real threat in your mirrors; the rest of the time, race the line and pull a gap."
  intermediate: "Defensive-line share {{defensive_line_lap_share}}, cost {{lap_time_loss_per_defensive_lap_seconds}}s/defensive-lap. The lap-time math is easy: defending pre-emptively against a car you've already gapped trades fast laps for nothing. Threshold rule: only switch to defensive geometry when the gap behind is closing faster than the cost of defending. If gap is stable or growing, race the line."
  advanced: "Defensive-line share {{defensive_line_lap_share}}, per-lap cost {{lap_time_loss_per_defensive_lap_seconds}}s; cumulative session leakage = share * cost * lap_count. The decision-theory frame: defending is rational when (P(loss-from-not-defending) * cost-of-position-loss) > (cost-of-defending). Most over-defending stems from misreading mirror distance — the car looks closer than it is, so the cost-benefit of defending gets overweighted. Calibrate gap reads against actual closing rate from the previous 2-3 laps before deciding to switch geometry."

prescription:
  drill_template_id: "drill.gap_aware_line_selection"
  expected_gain_kmh: "1-2"
  success_condition:
    metric: "defensive_line_lap_share"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["defensive-line discipline transfers — gap reading and cost-benefit framing are the same skill on either platform. Sim drivers tend to over-defend slightly more (mirror affordances are different — narrower FOV makes cars look closer); real-car drivers may need explicit reminders that mirror distance is platform-calibrated. The threshold may need a small relaxation for sim cohorts (e.g., 0.45 share) and tightening for real (e.g., 0.35 share)."]
