id: "rc.restart_acceleration.poor_launch"
version: 1
category: technique
subcategory: restart_acceleration
difficulty: intermediate

detection:
  signal: restart_first_lap_avg_speed_deficit_kmh
  condition: "restart_first_lap_avg_speed_deficit_kmh >= 3.0 and restart_event_count >= 2"
  context:
    must_have_channels: ["throttle", "speed", "lap_position", "flag_state"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 3.0 = low, 5.0 = medium, 8.0 = high"

explanation_template:
  beginner: "On {{restart_event_count}} restarts your first restart-lap was {{restart_first_lap_avg_speed_deficit_kmh}} km/h slower than your own clean-air pace on average. Restarts are where positions move — a slow launch hands the cars behind a free attempt. Pre-decide your restart geometry: which curb you'll use, where you'll commit to throttle, and whether you'll cover the inside line into the first corner. Surprise restarts cost time; rehearsed ones don't."
  intermediate: "Restart-lap speed deficit avg {{restart_first_lap_avg_speed_deficit_kmh}} km/h vs clean-air pace, n={{restart_event_count}}. The pattern is launch-readiness, not pace deficit (clean-air pace is the reference). Common causes: hesitation on green, wrong gear selection at line-up speed, brake-warming routine that left you cold-tired into T1, or being caught looking at the car ahead instead of the green flag. Drill the restart sequence as a closed-loop motor program — same gear, same RPM target, same trigger."
  advanced: "Restart speed deficit {{restart_first_lap_avg_speed_deficit_kmh}} km/h, n={{restart_event_count}}. Position-loss expectation per restart at this deficit ≈ 0.4-0.8 places (depends on field density). Distinct from T132 (in-stint fade) and T135 (passing-abort) — restarts are a discrete event class with their own preparation window (the SC laps), so the drill is event-rehearsal, not in-stint discipline. The pre-restart radio / dash drill: at 'one to go' verify gear, RPM, and brake temps; at green, eyes on the flag not the car ahead."

prescription:
  drill_template_id: "drill.restart_sequence_closed_loop"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "restart_first_lap_avg_speed_deficit_kmh"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["restart launch transfers — the gear-selection and trigger discipline are the same skill on either platform. Sim drivers benefit from algorithmically-fair starts (no clutch-bite variability), so deficits in sim are pure decision/preparation; real drivers also fight clutch modulation and grip variation, which can inflate the deficit by 1-2 km/h independently of skill. Consider relaxing the threshold by ~30% for real-car cohorts."]
