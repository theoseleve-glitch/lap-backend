id: "co.braking_point_drift.over_run"
version: 1
category: technique
subcategory: braking_point_drift
difficulty: intermediate

detection:
  signal: brake_point_drift_magnitude_meters_per_lap
  condition: "brake_point_drift_magnitude_meters_per_lap >= 0.50 and clean_lap_count_in_session >= 5"
  context:
    must_have_channels: ["brake", "lap_time", "distance"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.50 = low, 1.00 = medium, 2.00 = high"

explanation_template:
  beginner: "Across {{clean_lap_count_in_session}} clean laps your brake points drifted by {{brake_point_drift_magnitude_meters_per_lap}}m per lap on average. You're not braking at the same place each lap — that's why every corner feels different. Pick a fixed reference (a sign, a curb edge, a paint mark) for each braking zone and brake on that mark, lap after lap. The mark beats the feeling."
  intermediate: "Brake-point slope magnitude {{brake_point_drift_magnitude_meters_per_lap}}m/lap across {{clean_lap_count_in_session}} clean laps. Drift in either direction (creeping earlier from caution, or sliding later from over-confidence) breaks corner-entry rhythm and inflates lap-time variance. Anchor brake points to fixed visual references; expect T131 lap-time spread to drop alongside as the entry rhythm stabilizes."
  advanced: "Magnitude of brake-point OLS slope {{brake_point_drift_magnitude_meters_per_lap}}m/lap over n={{clean_lap_count_in_session}} clean laps. Channel-level cause for T132 (`co.lap_time_trend.fade_over_run`) when both fire together — the drift is the source, the fade is the symptom. When only T134 fires (and lap-time slope is small) the driver is compensating downstream (slower entry speed, later turn-in) and the brake-point fix recovers the lost time without further changes. Drill: visual-reference anchor on the 3 highest-load braking zones first."

prescription:
  drill_template_id: "drill.brake_point_visual_anchor"
  expected_gain_kmh: "1-2"
  success_condition:
    metric: "brake_point_drift_magnitude_meters_per_lap"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["brake-point anchoring transfers — visual-reference discipline is the same skill on either platform. Sim drivers typically have richer reference cues (fewer obstructions, no helmet narrowing, brake markers always crisp); real drivers may need to deliberately rehearse brake-mark identification during installation laps. Threshold may need a small relaxation (e.g., 0.70m/lap) for real-car cohorts in mixed-light conditions."]
