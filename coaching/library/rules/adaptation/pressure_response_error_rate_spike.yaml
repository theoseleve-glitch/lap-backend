id: "ad.pressure_response.error_rate_spike"
version: 1
category: strategy
subcategory: pressure_response
difficulty: intermediate

detection:
  signal: error_rate_pct_above_low_pressure_baseline
  condition: "pressure_context_score >= 0.60 and error_rate_pct_above_low_pressure_baseline >= 0.50"
  context:
    must_have_channels: ["lap_time", "session_id", "lockup_event", "slide_event", "off_track_event"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 2
    window_days: 30

severity_rule: "linear, 0.50 = low, 0.80 = medium, 1.20 = high"

explanation_template:
  beginner: "In high-pressure sessions (championship implications, target lap time, broadcast — context score {{pressure_context_score}}) your error rate jumps {{error_rate_pct_above_low_pressure_baseline}} above your low-pressure baseline. Same driver, same car, same setup — the error rate only spikes when the stakes do. Pressure response is a learnable skill, not a fixed trait. The drill: practice in deliberately-elevated-stakes conditions (set yourself a target lap time you must beat, or run a 'one-shot' session where mistakes have explicit consequences), so the high-pressure error response becomes calibrated through reps rather than only encountered in the moments that matter."
  intermediate: "Pressure context {{pressure_context_score}}, error spike {{error_rate_pct_above_low_pressure_baseline}} above baseline. Distinct from skill / fatigue / setup error rules by tying the spike to a pressure context: the same driver in the same conditions has different error rates depending on perceived stakes, which means the failure mode is the pressure response itself, not the input precision. Common manifestations: (a) over-tightening grip on the wheel (reduces feel, increases lockups); (b) shortening breath cycles (reduces processing time for visual cues); (c) over-rehearsing the upcoming lap mentally (reduces moment-to-moment feedback integration). The drill is exposure-based — deliberately constructed pressure during practice builds the calibration that high-stakes situations demand."
  advanced: "Pressure score {{pressure_context_score}}, error spike {{error_rate_pct_above_low_pressure_baseline}}. The mechanism is well-characterized: under acute stress, sympathetic-nervous-system activation narrows attention to perceived-threat cues, which in driving inverts: the driver fixates on 'don't crash' / 'don't miss this lap' rather than the moment-to-moment feedback (corner exit, tire feel, brake bite) that produces the lap. The disciplined alternative is two-part: (a) deliberate-practice pressure exposure via target-time drills, simulated qualifying, championship-stakes practice races — building stress tolerance through reps; (b) in-moment process focus protocols — explicit pre-corner cue (e.g., 'eyes through apex'), explicit breathing pattern (4-7-8 or box-breathing), explicit physical reset between laps. Calibration: 0.60 pressure-score threshold corresponds to roughly the cohort-typical 'sessions where it matters' boundary — championship implications, broadcast, target lap times, race-end window; below it the session is low-stakes practice. The 0.50 error-spike threshold corresponds to the cohort-noise floor for high-pressure error elevation; above it the structural pressure-response gap dominates the error rate. Diagnostic priority: T159 fires alongside other adaptation rules in race-decisive sessions when the underlying issue is pressure response rather than the specific adaptation context."

prescription:
  drill_template_id: "drill.pressure_response_protocol"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "error_rate_pct_above_low_pressure_baseline"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["pressure-response calibration transfers — the exposure-based and process-focus protocols are the same skills on either platform. Sim drivers face a typically-lower baseline pressure level (no physical-injury risk, infinite restarts) which makes pressure exposure harder to manufacture authentically; the rule applies but the pressure-context calibration may need adjustment for sim-typical leverage levels (esports prize money, livestream audience, leaderboard standings replace physical-injury and championship stakes). Real-car drivers face additional physiological pressure responses (cortisol-driven cognitive narrowing, fight-or-flight motor effects) that compound the issue; the breathing / process-focus protocols apply but may need explicit physical reset components (cooldown lap pacing, deliberate hand-relaxation) on top of the cognitive ones."]
