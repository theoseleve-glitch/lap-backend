id: "ad.setup_change.regression"
version: 1
category: strategy
subcategory: setup_decisions
difficulty: beginner

detection:
  signal: setup_change_lap_time_regression_seconds
  condition: "setup_change_lap_time_regression_seconds >= 0.20 and clean_lap_count_post_setup_change >= 5"
  context:
    must_have_channels: ["lap_time", "setup_change_marker", "stint_index"]
    min_corner_priority: low
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.20 = low, 0.40 = medium, 0.80 = high"

explanation_template:
  beginner: "After your last setup change, your clean-lap pace is {{setup_change_lap_time_regression_seconds}}s slower across {{clean_lap_count_post_setup_change}} laps. The change made the car worse, but you kept driving with it. The reflex to chase a feeling ('the rear feels better now') overrides the lap-time data ('but I'm half a second slower'). Build a revert protocol: if the post-change lap-time delta is negative after 5 clean laps, revert by default. The change can come back later with a different supporting tweak; staying on a known-bad setup costs full sessions."
  intermediate: "Setup-change regression {{setup_change_lap_time_regression_seconds}}s, post-change laps {{clean_lap_count_post_setup_change}}. The cognitive failure mode is sunk-cost on the setup decision: the engineer-driver pair invested time picking the change, so reverting feels like admitting the picking-process was wrong. The discipline is to separate the picking-decision (which is fine — exploration is part of the loop) from the keeping-decision (which should be governed by the lap-time delta only). Drill: explicit pre-session contract that any change with >=0.20s regression after 5 clean laps reverts unconditionally; the next change attempt happens after that revert."
  advanced: "Regression {{setup_change_lap_time_regression_seconds}}s, n={{clean_lap_count_post_setup_change}}. Decision-theory frame: the cost of keeping a regressed setup compounds — every session driven on a sub-optimal setup is a session of skill-development on the wrong reference, which contaminates the next setup decision (you can't tell whether the next change improved the car or you adapted to the bad setup). Revert-first protocol restores the clean baseline that future change-decisions need as a control. Calibration: 0.20s threshold is one driver-confidence interval (typical CoV) — below it the regression could be lap-to-lap noise; above it it's signal. The 5-lap minimum aligns with stint-pace-decay sample-size guards across other rules (T142, T143, T145) — same statistical-meaningfulness floor across the rule library."

prescription:
  drill_template_id: "drill.setup_change_revert_protocol"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "setup_change_lap_time_regression_seconds"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["revert-protocol discipline transfers — the keeping-decision rule (revert when delta>=0.20s after 5 laps) is the same on either platform. Sim drivers benefit from instant before/after lap-time visibility (in-game telemetry overlay); real-car drivers wait for engineer feedback between runs and may need longer measurement windows on session-limited days. The protocol is the same; the data-collection cadence differs."]
