id: "ad.qualifying_vs_race.pace_delta"
version: 1
category: strategy
subcategory: format_transfer
difficulty: intermediate

detection:
  signal: qualifying_to_race_percentile_drop
  condition: "qualifying_to_race_percentile_drop >= 0.20 and clean_lap_count_in_race_session >= 5"
  context:
    must_have_channels: ["lap_time", "session_type", "session_id", "lap_number"]
    min_corner_priority: low
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 1
    window_days: 30

severity_rule: "linear, 0.20 = low, 0.40 = medium, 0.60 = high"

explanation_template:
  beginner: "Your qualifying ranking dropped {{qualifying_to_race_percentile_drop}} cohort percentile points by race pace, across {{clean_lap_count_in_race_session}} clean race laps. You can find one quick lap but you're not sustaining that pace across a stint. Quali pace and race pace are different skills — quali is one perfect lap (peak commitment, peak references, no margin); race is 30 reps within 0.3s of each other (consistent commitment, sustainable references, fuel-and-tire awareness). The drill: pick one quali-mode reference per session, deliberately replicate it for 5 consecutive laps in race-pace conditions. Build the muscle memory of 'this commitment level, sustained' rather than 'this commitment level, one shot'."
  intermediate: "Quali-to-race percentile drop {{qualifying_to_race_percentile_drop}}, n={{clean_lap_count_in_race_session}}. Distinct from `ad.new_track.learning_rate_slow` (T156 — track-learning) and `ad.car_change.transfer_gap` (T157 — platform transfer) by attributing specifically to the quali-aggression-vs-race-commitment transfer failure mode: same driver, same track, same car, different format. Common failure shapes: (a) cold-tire over-commit on out-laps in race that scrubs the rest of the stint; (b) defensive over-aggression from quali habits (max-attack on every corner) that's unsustainable across stint length; (c) failure to throttle-modulate to fuel/tire window, defaulting to quali-mode brake-late inputs. The drill targets sustained-replication discipline — committing to the quali-reference but staging the commitment across 5+ consecutive laps."
  advanced: "Percentile drop {{qualifying_to_race_percentile_drop}}, n={{clean_lap_count_in_race_session}}. The cognitive frame: quali pace is a peak-performance task (one-shot, no replication required); race pace is a sustained-performance task (consistent replication across many reps, with degraded inputs from tire wear and fuel burn). The two skills draw on overlapping but distinct calibrations — quali calibrates 'absolute limit'; race calibrates 'sustainable limit at lap-N tire state'. Drivers who optimize only for the peak under-develop the sustained skill. The disciplined alternative is per-stint reference-cycling: in race-pace conditions, deliberately replicate the quali-reference for N laps, observe degradation, recalibrate the sustainable reference 1-2% off-peak. Calibration: 0.20 percentile-drop threshold corresponds to roughly cohort-noise-floor for quali-to-race format-transfer (drivers within ±10 percentile points are equivalent across formats); 0.40+ drop indicates a structural format-transfer gap that dominates pace deficit. The 5-lap race-pace minimum aligns with the statistical-meaningfulness floor used elsewhere in the rule library (T142, T143, T145, T152)."

prescription:
  drill_template_id: "drill.qualifying_aggression_to_race_transfer"
  expected_gain_kmh: "2-5"
  success_condition:
    metric: "qualifying_to_race_percentile_drop"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["sustained-replication discipline transfers — the per-stint reference-cycling protocol is the same skill on either platform. Sim drivers benefit from unlimited race-pace practice between qualifying simulations, which compresses the format-transfer learning loop. Real-car drivers face race-time as a scarce resource and may need to dedicate a full session to race-pace simulation, with the engineer-driver pair specifically agreeing not to chase quali-mode setups during that session. The rule applies to both endurance contexts (long-stint pace where the failure is more costly) and sprint contexts (short-stint where the failure is less costly but the format-transfer skill is the same)."]
