id: "ad.traffic_loss.defensive_excess"
version: 1
category: strategy
subcategory: traffic_management
difficulty: beginner

detection:
  signal: defensive_lap_time_cost_seconds
  condition: "traffic_proximity_pct_lap >= 0.30 and defensive_lap_time_cost_seconds >= 0.40"
  context:
    must_have_channels: ["lap_time", "competitor_gap_seconds", "racing_line_offset_m", "lap_number"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.40 = low, 0.70 = medium, 1.00 = high"

explanation_template:
  beginner: "When you were in close traffic ({{traffic_proximity_pct_lap}} of the lap), your defensive line and input choices cost {{defensive_lap_time_cost_seconds}}s vs your clean-air pace. You're defending harder than the position is worth — sacrificing more lap-time to protect from a single overtake than you'd lose by accepting one and pushing on. The rule of thumb: defend the moves that cost you cheap (a small line adjustment in a fast corner), cede the moves that cost you expensive (sacrificing apex speed in your strongest corner to block someone who's faster anyway). When defense costs you 0.4s+ per lap, the next driver is catching you on the back of the over-defended driver in front."
  intermediate: "Traffic proximity {{traffic_proximity_pct_lap}}, defensive cost {{defensive_lap_time_cost_seconds}}s. Distinct from `rc.defensive_line_too_often` (consistency-namespace racecraft rule on overall defensive-line frequency) by being adaptation-driven: the failure mode is specifically over-calibrating the defense response in active traffic, not a general defensive-line preference. T155 surfaces the cost-benefit miscalibration — defense is rational at zero or low cost, but at >=0.40s/lap the cumulative deficit usually exceeds the position-value of holding off one car. The drill is explicit cheap-vs-expensive defense decision-making: defend in fast corners (low marginal cost), cede in slow corners (high marginal cost), let the overtaker through if your tire-life advantage means you'll repass anyway."
  advanced: "Traffic pct {{traffic_proximity_pct_lap}}, defense cost {{defensive_lap_time_cost_seconds}}s. Decision-theory frame: position value is monotonic in race-time-remaining and attacker-pace-delta — defending one position is worth more lap-time-sacrifice with 5 laps to go vs 30, and worth more vs a slower attacker who'll fall back anyway than vs a faster one who'll get past eventually. The disciplined alternative is per-position cost-budgeting: estimate the lap-time cost of holding the next overtake attempt (run number through corner-by-corner), estimate the position value (delta to next pit window, championship implications, attacker tire-life), defend if cost < value, cede if cost > value. The 0.40s/lap threshold is a cohort-typical cumulative-cost floor — below it the defense is plausibly within position-value bounds; above it the defense is consuming more than two laps of clean-air pace per traffic stint, which dominates almost any plausible position-value gain. Calibration: 0.30 traffic-proximity threshold corresponds to roughly half a sector continuously in close range, where defensive line-choice actually has consequences (vs sub-0.30 where the gap closes only briefly and defensive line costs nothing)."

prescription:
  drill_template_id: "drill.traffic_defensive_cost_calibration"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "defensive_lap_time_cost_seconds"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["cost-benefit defense calibration transfers — the underlying decision (cheap vs expensive defense) is the same skill on either platform. Sim drivers benefit from clean-air vs in-traffic delta widgets that make the defense cost visible in real-time; real-car drivers rely on engineer feedback and post-session analysis for cumulative cost data, so the calibration may need a longer convergence window. Real-car racing also includes physical risks (door-to-door damage, mechanical wear from defensive aggression) that increase the implicit cost of expensive defense beyond the lap-time signal alone — the cost-benefit threshold is effectively lower in real-car contexts."]
