id: "tm.cold_tire_mistakes.first_3_laps"
version: 1
category: strategy
subcategory: cold_tire_mistakes
difficulty: beginner

detection:
  signal: mistake_event_count_first_3_laps
  condition: "mistake_event_count_first_3_laps >= 3 and tire_temp_avg_first_3_laps_below_optimal_celsius >= 10.0"
  context:
    must_have_channels: ["tire_temp", "throttle", "brake", "lap_number"]
    min_corner_priority: low
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 3 = low, 5 = medium, 8 = high"

explanation_template:
  beginner: "In the first 3 laps you made {{mistake_event_count_first_3_laps}} mistakes (lockups, slides, off-tracks) while your tires were averaging {{tire_temp_avg_first_3_laps_below_optimal_celsius}}°C below their optimal window. Cold tires don't work like warm ones — same braking force locks them up, same steering input slides them. Drive the first 2 laps at 80%, the third at 90%, and only commit to full pace once the tires are in. Mistakes early cost more than the time saved by pushing."
  intermediate: "Cold-tire mistake count {{mistake_event_count_first_3_laps}} in laps 1-3, avg temp deficit {{tire_temp_avg_first_3_laps_below_optimal_celsius}}°C. Inverse diagnostic shape to T141 (`tm.tire_temp_overheat.aggressive_early`): T141 fires when over-aggression overheats tires; T149 fires when over-aggression on under-temp tires causes mistakes. Same underlying pattern (early-stint commitment vs tire state), different thermal direction. Drill: explicit per-lap commitment level for the first 3 laps (80% / 90% / 100%) tied to tire temp readouts."
  advanced: "Mistakes {{mistake_event_count_first_3_laps}}, temp deficit {{tire_temp_avg_first_3_laps_below_optimal_celsius}}°C. Cold-tire grip drops non-linearly — at 15°C below optimal, peak μ is ~70-80% of warm; at 25°C below, ~50%. Each mistake compounds: a lockup flat-spots a still-cold tire (T144 territory), an off-track puts marbles on the tire that delay warm-up further. The drill is staged commitment with explicit temp gates, not generic 'be careful' — driver needs an objective threshold (e.g., 'at least 80°C inner-shoulder before lap-3 hot-line') rather than a vibes-based assessment."

prescription:
  drill_template_id: "drill.staged_cold_tire_commitment"
  expected_gain_kmh: "1-2"
  success_condition:
    metric: "mistake_event_count_first_3_laps"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["staged-commitment discipline transfers — tying commitment to objective tire-temp readouts is the same skill on either platform. Sim cold-tire grip models vary in fidelity (some titles model the non-linear grip drop accurately, others approximate it as linear or omit cold-tire effects entirely); the rule is most useful in titles with realistic thermal models. Real-car drivers face additional cold-brake effects in the first 1-2 laps that compound the cold-tire issue; the staged-commitment drill applies but may need explicit brake-temp gates as well as tire-temp gates."]
