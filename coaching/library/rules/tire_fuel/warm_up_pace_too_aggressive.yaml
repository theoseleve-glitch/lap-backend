id: "tm.warm_up_pace.too_aggressive"
version: 1
category: strategy
subcategory: warm_up_pace
difficulty: beginner

detection:
  signal: warm_up_lap_time_pct_above_session_best
  condition: "warm_up_lap_time_pct_above_session_best <= 0.02 and clean_lap_count_in_session >= 5"
  context:
    must_have_channels: ["lap_time", "lap_number", "stint_index"]
    min_corner_priority: low
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.02 = low, 0.01 = medium, 0.005 = high"

explanation_template:
  beginner: "Your warm-up laps were within {{warm_up_lap_time_pct_above_session_best}} of your session-best across {{clean_lap_count_in_session}} clean laps. You're trying to qualify from lap 1. The cost shows up as overheating tires (T141), cold-tire mistakes (T149), or both — and the lap time you're chasing in the warm-up window is taken back later in the stint when the tires fall off harder. Stage the warm-up: lap 1 = 80%, lap 2 = 90%, full pace from lap 3."
  intermediate: "Warm-up pace within {{warm_up_lap_time_pct_above_session_best}} of session-best, n={{clean_lap_count_in_session}}. Upstream-cause rule for the early-stint thermal-misfit pair: T141 (overheat) and T149 (cold-tire mistakes) are downstream symptoms; T150 is the cause. When T150 fires, the prescription routing prioritizes T150's staged-warm-up drill over the symptom-specific drills — fixing the upstream pace problem typically resolves both downstream signatures simultaneously."
  advanced: "Warm-up pace pct {{warm_up_lap_time_pct_above_session_best}}, n={{clean_lap_count_in_session}}. The tire physics: peak μ tracks a non-linear function of bulk temp + carcass temp + surface scrubbing. Forcing quali-pace inputs in lap 1 either overheats the surface (front-graining circuits) or fails to penetrate the carcass enough for grip (rear-locking circuits) — same mechanism, opposite manifestations. Diagnostic priority: T150 > {T141, T149} in the prescription queue; the staged-warm-up drill (80% / 90% / 100% per the beginner template) addresses both downstream rules without needing to coach them separately."

prescription:
  drill_template_id: "drill.staged_warm_up_pace_levels"
  expected_gain_kmh: "1-2"
  success_condition:
    metric: "warm_up_lap_time_pct_above_session_best"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["staged warm-up transfers — the discipline is the same skill on either platform. Sim drivers benefit from algorithmically-sharp lap-time delta widgets that make warm-up pace easy to stage to the percent. Real-car drivers face additional brake-warming and ERS deployment-map constraints that decouple lap-time from pace effort in the warm-up window; the rule's staged-pace targets remain valid but the driver may need to use different proxies (e.g., 'don't go full throttle out of T1 until lap 3') rather than directly targeting a lap-time pct."]
