id: "th.early_throttle.snap_oversteer"
version: 1
category: technique
subcategory: early_throttle
difficulty: beginner

detection:
  signal: throttle_pct_at_apex
  condition: "throttle_pct_at_apex > 0.40 and peak_rear_slip_angle_deg > 6.0"
  context:
    must_have_channels: ["throttle", "steering_angle", "rear_slip_angle"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 2
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 6.0 = low, 9.0 = medium, 12.0 = high"

explanation_template:
  beginner: "On {{corner}} you opened throttle to {{throttle_pct_at_apex}} at the apex and the rear stepped out to {{peak_rear_slip_angle_deg}}°. You're picking up too early — wait for the steering wheel to come back toward straight before squeezing the pedal."
  intermediate: "Early-throttle snap on {{corner}} — apex throttle = {{throttle_pct_at_apex}}, peak rear slip = {{peak_rear_slip_angle_deg}}°. The rear is loaded for cornering, not propulsion; commit only after the front begins unwinding."
  advanced: "Snap oversteer event on {{corner}}: throttle_pct_at_apex={{throttle_pct_at_apex}}, peak_rear_slip_angle_deg={{peak_rear_slip_angle_deg}}°. Delay full-throttle commit by 100-150ms; in the same window steering input should drop ≥30%."

prescription:
  drill_template_id: "drill.delayed_throttle_apex_pickup"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "peak_rear_slip_angle_deg"
    comparison: "lte"
    target_pct: 0.70
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["sim slip-angle response is sharper than real; real cars' tire compliance softens the snap onset by 50-100ms — commit timing carries over but expect a slightly shorter wait window"]
