id: "th.exit_commit.confidence_deficit"
version: 1
category: technique
subcategory: exit_commit
difficulty: beginner

detection:
  signal: exit_throttle_commit_delay_ms
  condition: "exit_throttle_commit_delay_ms >= 400 and available_grip_margin_pct >= 0.30"
  context:
    must_have_channels: ["throttle", "g_lat", "wheel_speed"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 2
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.30 = low, 0.40 = medium, 0.55 = high, scaled on available_grip_margin_pct"

explanation_template:
  beginner: "On {{corner}} you waited {{exit_throttle_commit_delay_ms}}ms after the apex to commit, and there was {{available_grip_margin_pct}} grip you weren't using. The car was ready, you weren't. This is a confidence problem — drill the corner at progressively earlier commits until you find the actual limit."
  intermediate: "Confidence-deficit at {{corner}} exit — commit delay {{exit_throttle_commit_delay_ms}}ms with {{available_grip_margin_pct}} unused grip margin. Grip the chassis offered you wasn't taken; the technique is correct but the trigger is conservative. Anchor exit reference points and progressively advance the commit point."
  advanced: "Exit confidence-deficit on {{corner}}: delay={{exit_throttle_commit_delay_ms}}ms, margin={{available_grip_margin_pct}}. Margin >0.30 with delay >400ms quantifies 'could go but doesn't'; this is the technique-vs-mental-model gap. Each 100ms reduction at constant grip margin recovers ~0.05s; cap at margin <=0.15 to leave engineering tolerance."

prescription:
  drill_template_id: "drill.progressive_exit_commit"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "exit_throttle_commit_delay_ms"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: false
    caveats: ["sim drivers can probe the limit safely — confidence built in sim does not guarantee transferable judgment in real cars where the cost of being wrong is higher and the limit signals (kerb feel, smell, sound) are absent. Use sim drilling to discover the technique, not to set the commit threshold for real."]
