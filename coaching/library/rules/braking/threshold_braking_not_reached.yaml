id: "br.threshold_braking.not_reached"
version: 1
category: technique
subcategory: threshold_braking
difficulty: beginner

detection:
  signal: peak_decel_grip_ratio
  condition: "peak_decel_grip_ratio < 0.85"
  context:
    must_have_channels: ["brake", "speed", "long_g"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 3
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.85 = low, 0.78 = medium, 0.70 = high"

explanation_template:
  beginner: "You're only using {{usage_pct}}% of the available braking grip. Push the pedal harder — the tires can take more before they lock."
  intermediate: "Peak deceleration at {{usage_pct}}% of grip ceiling. You're leaving braking distance on the table; press through to threshold pressure and hold it until the trail-brake taper-off begins."
  advanced: "Peak longitudinal acceleration = {{usage_pct}}% of estimated μ-ceiling. Brake-pressure plateau falls short of the tire's friction limit; recalibrate threshold pedal force from current setup parameters."

prescription:
  drill_template_id: "drill.threshold_braking_progression"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "peak_decel_grip_ratio"
    comparison: "gte"
    target_pct: 0.92
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: false
    caveats: ["sim brake-pedal force calibration is harder than real-world; sim drivers often need a load-cell pedal to produce repeatable threshold pressure that maps to the chassis sim's grip model"]
