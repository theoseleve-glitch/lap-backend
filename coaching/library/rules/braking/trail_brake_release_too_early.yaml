id: "br.trail_brake.release_too_early"
version: 1
category: technique
subcategory: trail_brake
difficulty: beginner

detection:
  signal: brake_release_position_pct
  condition: "brake_release_position_pct < 0.60"
  context:
    must_have_channels: ["brake", "speed", "steering_angle"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 3
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.60 = low, 0.45 = medium, 0.30 = high"

explanation_template:
  beginner: "You let the brake off way before the apex on {{corner}} — about {{release_pct}}% of the way in. Keep some pressure on into rotation; the front of the car needs that load to bite and turn."
  intermediate: "Brake release at {{release_pct}}% of the entry distance on {{corner}}. Trail off pressure into the apex rather than dropping the pedal at turn-in; without weight on the front, the car will push wide."
  advanced: "Brake-release position = {{release_pct}}% of marker-to-apex on {{corner}}. Premature unload removes longitudinal weight transfer before lateral grip demands peak; chassis transitions to understeer-prone front-axle saturation."

prescription:
  drill_template_id: "drill.trail_brake_carry_to_apex"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "brake_release_position_pct"
    comparison: "gte"
    target_pct: 0.80
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["sim FFB cues for front-end loading are weaker than real-world seat-of-pants feedback; sim drivers may need to consciously calibrate the release point off the brake-trace overlay"]
