id: "br.inconsistent_pressure.sector_variance"
version: 1
category: technique
subcategory: inconsistent_pressure
difficulty: beginner

detection:
  signal: brake_pressure_cov_in_sector
  condition: "brake_pressure_cov_in_sector > 0.15"
  context:
    must_have_channels: ["brake", "lap_number"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 2
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.15 = low, 0.20 = medium, 0.30 = high"

explanation_template:
  beginner: "Your brake pressure varies {{cov_pct}}% lap-to-lap in {{sector}}. You're guessing at the brake — pick a target pressure and hit it every lap."
  intermediate: "Brake-pressure CoV of {{cov_pct}}% in {{sector}} indicates lap-to-lap inconsistency. Anchor on a fixed pressure target and use the same reference point each lap."
  advanced: "Lap-to-lap brake-pressure CoV = {{cov_pct}}% across {{sector}}. Variance dominates over signal — establish a brake-pressure invariant per corner before optimizing other inputs."

prescription:
  drill_template_id: "drill.brake_pressure_anchor"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "brake_pressure_cov_in_sector"
    comparison: "lte"
    target_pct: 0.10
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["sim load-cell pedals make repeatability easier; real-world brake feel adds heat-cycle and pedal-firmness variation that's harder to anchor"]
