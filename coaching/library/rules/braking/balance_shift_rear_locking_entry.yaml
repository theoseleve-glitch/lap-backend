id: "br.balance_shift.rear_locking_entry"
version: 1
category: technique
subcategory: balance_shift
difficulty: beginner

detection:
  signal: rear_front_slip_ratio_entry
  condition: "rear_front_slip_ratio_entry > 1.5"
  context:
    must_have_channels: ["wheel_speed_fl", "wheel_speed_fr", "wheel_speed_rl", "wheel_speed_rr", "brake"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 2
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 1.5x = low, 2.0x = medium, 3.0x = high"

explanation_template:
  beginner: "Your rear wheels are locking more than the front into {{corner}} — about {{ratio_pct}}% the slip of the front. Two likely causes: brake bias is set too far rearward, or you're not loading the front before the brakes bite."
  intermediate: "Rear/front slip ratio of {{ratio_pct}}% on {{corner}} entry. Either bias the brakes more forward or build pedal pressure progressively to weight-transfer onto the front before the rear locks."
  advanced: "Entry-phase rear/front slip ratio = {{ratio_pct}}% on {{corner}}. Brake-bias rearward of optimum or pedal-rise rate too steep relative to weight-transfer dynamics; investigate bias setting before adjusting technique."

prescription:
  drill_template_id: "drill.brake_bias_and_pedal_loading"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "rear_front_slip_ratio_entry"
    comparison: "lte"
    target_pct: 1.2
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["sim chassis-load models vary in fidelity; real-world rear lockup is also influenced by tire age and track temp, factors most sims simplify"]
