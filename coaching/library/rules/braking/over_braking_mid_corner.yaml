id: "br.over_braking.mid_corner"
version: 1
category: technique
subcategory: over_braking
difficulty: beginner

detection:
  signal: mid_corner_brake_pressure_pct
  condition: "mid_corner_brake_pressure_pct > 0.20"
  context:
    must_have_channels: ["brake", "speed", "steering_angle"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 3
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.20 = low, 0.30 = medium, 0.45 = high"

explanation_template:
  beginner: "You're still on the brake at the apex of {{corner}} — {{residual_pct}}% pressure. The brake should be off there, you're costing yourself speed by dragging it through the corner."
  intermediate: "Mid-corner brake pressure of {{residual_pct}}% on {{corner}}. Trail off the brake before turn-in is complete; carrying brake through the apex scrubs speed and unsettles the chassis on rotation."
  advanced: "Apex brake-pressure ratio = {{residual_pct}}% on {{corner}}. Brake-modulation phase extends past the rotation point; the chassis can't fully transition to lateral grip while longitudinal load remains active."

prescription:
  drill_template_id: "drill.brake_release_at_turn_in"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "mid_corner_brake_pressure_pct"
    comparison: "lte"
    target_pct: 0.10
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["real-world chassis feedback through the seat makes the cue more obvious; sim drivers may need to consciously watch brake-trace overlay to spot the issue"]
