id: "prep.target.milestone_3_sessions_remaining"
version: 1
category: strategy
subcategory: target_milestone
difficulty: beginner

detection:
  signal: sessions_until_target_event
  condition: "sessions_until_target_event <= 3"
  context:
    must_have_channels: ["sessions_until_target_event"]
    min_corner_priority: low
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 1
    window_days: 14

severity_rule: "binary, fires once at 3 sessions remaining"

explanation_template:
  beginner: "You have {{sessions_remaining}} session(s) left before {{target_event_name}}. Now is the time to focus your practice on event-specific drills — random practice this close to the date wastes the runway you have left."
  intermediate: "Target {{target_event_name}}: {{sessions_remaining}} session(s) remaining. Shift practice mix toward target-context drills (right track or right car). Generic improvement no longer compounds before the event."
  advanced: "Preparation window narrowing — {{sessions_remaining}} session(s) until {{target_event_name}}. Drop low-priority weakness work; consolidate around the 1-2 highest-leverage drills your readiness state flagged in target context."

prescription:
  drill_template_id: "drill.target_event_focus_session"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "preparation_sessions_completed_ratio"
    comparison: "gte"
    target_pct: 1.0
    measurement_window: "before_target_event"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["sim and real preparation cadences differ — a real-life endurance race typically has more constrained track time per session, so 3 sessions out may already be too late for venue-specific learning"]
