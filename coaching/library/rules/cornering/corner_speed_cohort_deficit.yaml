id: "cs.corner_speed.cohort_deficit"
version: 1
category: technique
subcategory: cohort_deficit
difficulty: beginner

detection:
  signal: corner_speed_cohort_percentile
  condition: "corner_speed_cohort_percentile <= 0.30 and cohort_member_count >= 20"
  context:
    must_have_channels: ["speed"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 1
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.30 = low, 0.20 = medium, 0.10 = high"

explanation_template:
  beginner: "On {{corner}} you're in the bottom {{corner_speed_cohort_percentile}} of {{cohort_member_count}} similar drivers in your car/track combo. There's measured time to find here from peers running the same configuration — most likely in min-speed or apex placement. Cross-reference your other corner-technique insights for this corner."
  intermediate: "Cohort deficit on {{corner}} — percentile {{corner_speed_cohort_percentile}} across {{cohort_member_count}} cohort members. Cohort comparison cuts past sim-vs-real and setup noise; the gap is real driver technique, not platform. Drill against the dominant T121-T129 weakness for this corner."
  advanced: "Cohort cornering deficit on {{corner}}: percentile={{corner_speed_cohort_percentile}}, n={{cohort_member_count}}. Cohort >=20 (T056) gates statistical reliability; the deficit signal is meaningful when this guard holds. Use the technique-level rules (T121-T129) as the actionable diagnosis; this rule prioritizes WHERE to look, not WHAT to fix."

prescription:
  drill_template_id: "drill.cohort_corner_audit"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "corner_speed_cohort_percentile"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["cohort comparisons are platform-specific by design (sim cohort vs sim driver, real vs real). Do not cross-coach across platforms — the cohort percentile only means something against same-platform peers."]
