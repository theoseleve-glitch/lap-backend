id: "cs.rotation_excess.overrotation_exit"
version: 1
category: technique
subcategory: rotation_excess
difficulty: beginner

detection:
  signal: exit_oversteer_index
  condition: "exit_oversteer_index >= 0.40 and exit_throttle_correction_count >= 1"
  context:
    must_have_channels: ["throttle", "steering", "g_lat", "yaw_rate"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 2
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.40 = low, 0.55 = medium, 0.70 = high"

explanation_template:
  beginner: "On exit of {{corner}} the rear stepped out — oversteer index {{exit_oversteer_index}} — and you had to lift {{exit_throttle_correction_count}} time(s) to catch it. Catching the car kills exit speed. Either commit the throttle smoother (less aggressive pickup) or address why the rear is light (later apex, more weight on the rear, suspension tune)."
  intermediate: "Exit overrotation on {{corner}} — oversteer index {{exit_oversteer_index}}, throttle corrections {{exit_throttle_correction_count}}. Yaw exceeding command past the apex requires throttle modulation that costs ~0.05-0.15s/corner; smooth throttle ramp + later peak (apex+50ms minimum) recovers the rear without giving up exit speed."
  advanced: "Active exit oversteer on {{corner}}: os_index={{exit_oversteer_index}}, lift_count={{exit_throttle_correction_count}}. Yaw-rate overshoot past commanded value indicates rear-tire saturation; root cause branch: throttle technique (T113/T117 territory), weight distribution (later apex = more rear load), or setup (rear damping / wing). Validate against throttle pickup rate before changing line."

prescription:
  drill_template_id: "drill.smooth_throttle_to_catch_rear"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "exit_oversteer_index"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["sim oversteer is more catchable than real — sim drivers often build over-aggressive throttle habits that produce real-world spins. The technique transfer (smoother pickup) is correct; the threshold may need to tighten in real cars where the consequence cost is higher."]
