id: "cs.min_speed.too_high_wide_line"
version: 1
category: technique
subcategory: min_speed
difficulty: beginner

detection:
  signal: min_corner_speed_excess_pct
  condition: "min_corner_speed_excess_pct >= 0.05 and apex_lateral_offset_m >= 0.50"
  context:
    must_have_channels: ["speed", "steering", "g_lat"]
    min_corner_priority: medium
  evidence_required:
    min_occurrences_in_session: 2
    min_sessions_in_window: 2
    window_days: 14

severity_rule: "linear, 0.05 = low, 0.08 = medium, 0.12 = high"

explanation_template:
  beginner: "On {{corner}} you carried {{min_corner_speed_excess_pct}} more speed than reference at the apex, and the car ran {{apex_lateral_offset_m}}m wide of the proper apex. You over-cooked it — the extra speed forced a wider line, which you'll pay for on exit. Brake a touch later and harder so you can hit the apex tighter."
  intermediate: "Min-speed too high on {{corner}} — excess {{min_corner_speed_excess_pct}}, apex offset {{apex_lateral_offset_m}}m wide. Carrying speed past the apex forces a wider arc; the wider arc compromises the straight-line acceleration you can apply on exit. Recover by deeper braking + earlier rotation."
  advanced: "Wide-line min-speed excess on {{corner}}: speed_excess={{min_corner_speed_excess_pct}}, apex_offset={{apex_lateral_offset_m}}m. Excess mid-corner speed widens the line, reducing exit-line angle by ~5-8 degrees per 0.5m of offset; the ~0.05-0.10s saved at apex is paid back ~2x on exit. Trade: deeper brake zone for tighter apex."

prescription:
  drill_template_id: "drill.brake_deeper_rotate_earlier"
  expected_gain_kmh: "1-3"
  success_condition:
    metric: "apex_lateral_offset_m"
    comparison: "lte"
    target_pct: 0.50
    measurement_window: "next_3_sessions"

transfer_profile:
  sim_vs_real:
    likely_transfers: true
    caveats: ["wide-line errors transfer well — geometric problem. The drill (deeper braking) is harder to execute confidently in real cars where over-braking has higher consequences; expect slower convergence on the target apex offset in real than in sim."]
