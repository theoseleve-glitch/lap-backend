name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -q

      # T234 — security scans. Both must pass for CI to go green.
      # bandit covers our own source (insecure code patterns);
      # pip-audit covers the dep graph (CVEs). The pip CVE is
      # ignored because pip is build-time tooling pulled in by
      # pip-audit itself, not a runtime dep, and has no fix
      # version published. Re-evaluate on each Renovate bump.
      - name: Bandit (own source)
        run: uv run bandit -r app domain infra coaching -ll

      - name: pip-audit (dep CVEs)
        run: uv run pip-audit --skip-editable --ignore-vuln CVE-2026-3219
