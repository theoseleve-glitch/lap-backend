[project]
name = "lap-backend"
version = "0.1.0"
description = "FastAPI + Celery + Postgres backend for LAP (Driver OS)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "LAP" }]
dependencies = [
    "fastapi>=0.115",
    "lap-schemas",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.uv.sources]
lap-schemas = { path = "../lap-schemas/python", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=1.19",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "domain"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
