[project]
name = "lap-backend"
version = "0.1.0"
description = "FastAPI + Celery + Postgres backend for LAP (Driver OS)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "LAP" }]
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
