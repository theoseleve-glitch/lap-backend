[project]
name = "lap-backend"
version = "0.1.0"
description = "FastAPI + Celery + Postgres backend for LAP (Driver OS)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "LAP" }]
dependencies = [
    "alembic>=1.13",
    "boto3>=1.35",
    "celery>=5.4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lap-schemas",
    "pydantic-settings>=2.0",
    "posthog>=3.7",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "redis>=5.0",
    "sentry-sdk[fastapi]>=2.20",
    "sqlalchemy[asyncio]>=2.0",
    "stripe>=11.0",
    "structlog>=24.0",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.uv.sources]
lap-schemas = { path = "../lap-schemas/python", editable = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.19",
    "fakeredis>=2.20",
    "moto[s3]>=5.0",
    "ruff>=0.15",
    "mypy>=1.19",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "types-pyyaml>=6.0",
    "schemathesis>=4.16.0",
    "pip-audit>=2.10.0",
    "bandit>=1.9.4",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "domain"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
